<p><strong>Meter vs fot</strong></p>

<p><strong>Celsius vs Fahrenheit</strong></p>
<p><em>Fahrenheit = (Celsius * 9/5) + 32</em></p>
<p><em>Celsius = (Fahrenheit - 32) * 5/9</em></p>
